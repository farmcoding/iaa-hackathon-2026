[project]
name = "iaa"
version = "0.1.0"
description = "IAA AI-Assisted Actuarial Hackathon 2026: risk-premium models and experiment loop"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "glum>=3.0",
    "pyyaml>=6.0",
    # approved by Karl 2026-10-18 (not society-linked; licences checked)
    "catboost>=1.2",
    "xgboost>=3.0",
    "interpret-core>=0.7",
    "model-diagnostics>=1.5",
    "plotly>=6.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# TabM on Apple Metal; installed in a separate venv (~/.cache/iaa-gpu) to keep the loop's
# environment small. Approved by the owner 2026-10-18.
gpu = [
    "torch==2.14.1",
    "tabm==0.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iaa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Security rules on by default (flake8-bandit subset): hardcoded secrets,
# shell=True, missing timeouts, silent try/except/pass, weak hashes.
extend-select = ["S102", "S105", "S106", "S107", "S110", "S113", "S324", "S501", "S602", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests
# the agent's seed-bag helper is called inside the same loop iteration it closes over
"src/iaa/experiment.py" = ["B023"]
# deliberate: re-runs historical experiment.py versions taken from git
"scripts/backfill_preds.py" = ["S102", "E701", "E702"]
# one failed illustration must not stop the others; the error is printed
"scripts/gen_images.py" = ["BLE001"]
