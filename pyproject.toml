[project]
name = "iaa"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iaa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Security rules on by default (flake8-bandit subset): hardcoded secrets,
# shell=True, missing timeouts, silent try/except/pass, weak hashes.
extend-select = ["S102", "S105", "S106", "S107", "S110", "S113", "S324", "S501", "S602", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests
