# Market assumptions for Part 2 (emerging market). Selected with IAA_MARKET=emerging.
# Every value here is an actuarial assumption: changes need a human decision and a
# note in reports/assumptions_log.md. First version 2026-10-25: Part 1 assumptions carried
# over wherever two emerging years cannot support an estimate of their own; each carried
# value is a Part 2 test item (reports/part2_drift.md).
market: emerging
valuation_date: "2024-12-31"
history_years: [2023, 2024]
predict_year: 2025

development:
  method: report_delay_cost_chain_ladder
  max_delay_months: 48
  # emerging claims cover two loss years (24 months of development at most), so the
  # report-delay patterns come from the developed market's 2021-24 claims, by the same
  # line x peril groups. Check: emerging and developed claims at the same maturity
  # (reports/part2_drift.md, development section).
  pattern_market: developed
  peril_groups:
    motor: {bodily_injury: [bodily_injury], other: [own_damage, third_party_prop, theft, glass_hail]}
    buildings: {weather: [storm, flood, subsidence], water: [escape_of_water], fire: [fire], ad: [accidental_damage]}
    contents: {all: [theft, escape_of_water, accidental_damage, flood]}
  ibner_open_factor: 1.0
  # Part 1 projects bodily injury as count x the 2021 severity. Emerging has no mature
  # year (2023 is the oldest) and a different severity regime (mean 10.7k vs 21.6k, max 156k
  # vs 11.9m), so v1 develops BI cost by chain ladder like the other perils. Open item.
  freq_sev: {}

trend:
  # carried over from the developed market (configs/market_dev.yaml): two emerging years
  # cannot separate trend from development and weather. Open item.
  motor: 0.030
  buildings: 0.065
  contents: 0.050

peril_trend:
  buildings: {weather: 0.09, water: 0.09, fire: 0.04, ad: 0.04}

harness:
  # one out-of-time fold: train 2023, score 2024 (2024 truth is itself developed with the
  # borrowed pattern, so the fold scores the model and the development assumption together)
  # R (owner 2026-10-25) reverses it: train 2024, score 2023. Not out of time, but a
  # second read on the same small book, and its truth (2023) is the more developed year.
  # Both folds use the developed 2021-23 base
  folds:
    B: {train: [2023], valid: 2024}
    R: {train: [2024], valid: 2023}
  final: {train: [2023, 2024], predict: 2025}
  time_budget_seconds: 1800
  primary_weights: {B: 1, R: 1}
  # 2026-10-25: on the anchored-level metric the Part 1 specification swung sd 0.0034
  # (buildings level, one fire year). On the level-neutral metric, base plus a light
  # correction over five seed offsets: primary sd 0.00038 (B 0.00025, R 0.00055). Margin
  # 0.001 (about 2.5 sd; the fresh-seed confirmation stays), worse fold may fall 0.002
  # 25 Oct midday: margin 0.002 (about 2x the paired sd of the 2:1 deploy metric, 0.0011);
  # either fold may fall 0.003 at most
  noise_floor: 0.002
  fold_floor: 0.003
  # the v0 row (2026-10-25T01:03:20) was scored at the anchored level, before the
  # level-neutral metric; not comparable
  superseded: ["2026-10-25T01:03:20"]
  # developed-market base prediction per row, by validation year (scripts/part2_base.py):
  # developed 2021-23 fit when scoring 2024, 2021-24 fit for 2025. Attached by harness.split
  base: {2023: part2_base_B.parquet, 2024: part2_base_B.parquet, 2025: part2_base_final.parquet}
  # per-peril base predictions (scripts/part2_base_perils.py --fine), same fit years; the
  # emerging peril mix differs (glass/hail and storm heavier, water lighter)
  base_perils:
    2023: part2_base_perils_fine_B.parquet
    2024: part2_base_perils_fine_B.parquet
    2025: part2_base_perils_fine_final.parquet
  # pooled two-market base, Part 1 pruning off, emerging rows weight 1 (scripts/part2_pooled.py);
  # one fit per scored year so a fold never trains on its own rows
  base_pooled:
    2023: part2_pooled_R.parquet
    2024: part2_pooled_B.parquet
    2025: part2_pooled_final.parquet
  # TabM developed base (N15, owner 27 Oct; scripts/part2_base_tabm.py on Kaggle GPU), same fit
  # years as base_perils
  base_tabm:
    2023: part2_base_tabm_B.parquet
    2024: part2_base_tabm_B.parquet
    2025: part2_base_tabm_final.parquet
  # per-peril bases refitted with exposure^0.5 fit weights (N16, owner 27 Oct)
  base_wp_perils:
    2023: part2_base_perils_fine_wp0.5_B.parquet
    2024: part2_base_perils_fine_wp0.5_B.parquet
    2025: part2_base_perils_fine_wp0.5_final.parquet
  # pooled two-market base with emerging rows as a fit weight (N13, owner 27 Oct, Kaggle CPU;
  # weight 20 is a diagnostic only)
  base_pooled_sw5:
    2023: part2_pooled_sw5_R.parquet
    2024: part2_pooled_sw5_B.parquet
    2025: part2_pooled_sw5_final.parquet
  base_pooled_sw20:
    2023: part2_pooled_sw20_R.parquet
    2024: part2_pooled_sw20_B.parquet
    2025: part2_pooled_sw20_final.parquet
  # per-peril bases averaged over in-band ages (N12, owner 27 Oct, Kaggle CPU)
  base_age_perils:
    2023: part2_base_perils_fine_age_B.parquet
    2024: part2_base_perils_fine_age_B.parquet
    2025: part2_base_perils_fine_age_final.parquet
  # level (owner, 2026-10-25): each line balanced so its training predictions sum to the
  # trended training actuals; the 2025 mix then moves the level. Board check on the
  # transfer file: history-anchored 0.14243, mix-adjusted 0.15079
  level: balance_on_train
  # keep metric (owner, 25 Oct midday, declared before the re-base run; GPT-6.1 Sol reviews,
  # research and advisor): "deploy" = end-to-end D2 at the production level, per fold
  # natural_share x natural + (1 - natural_share) x test-mix weighted (rows reweighted to
  # the 2025 book, scripts/part2_weights.py); primary = mean of folds B and R. 2:1 because
  # the weighted half is twice as noisy (paired bootstrap sd 0.0021 vs 0.00095 on fold B).
  # The level-neutral metric of 25 Oct night let 11 stacked factors gain +0.0068 on the folds
  # and lose 0.0029 on the board; it stays as a guard (ln_floor) and is logged (d2_ln_<fold>)
  metric: deploy
  natural_share: 0.6667
  testmix_weights: part2_testmix_weights.parquet
  ln_floor: 0.002
  # paired bootstrap of the primary gain over the bar: 10th percentile must be above zero
  bootstrap: true
  confirm_seed_offset: 100
  # structured corrections on fixed bases are deterministic; an exact reproduction on the
  # fresh-seed rerun then confirms instead of failing (Part 1 rule: it meant a fixed seed)
  deterministic_ok: true
  use_premium: false

large_loss:
  caps: {motor_bodily_injury: null}
